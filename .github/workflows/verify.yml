name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

# PR code needs neither a write token nor deployment credentials.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      # uv sync checks the lock first; subsequent pnpm scripts must not change it.
      UV_FROZEN: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Reads the exact pnpm version from package.json's packageManager.
      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.11"
          python-version: "3.13"
          working-directory: apps/api
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install locked Python dependencies
        # --locked must validate pyproject.toml, not inherit UV_FROZEN here.
        run: uv --directory apps/api sync --locked
        env:
          UV_FROZEN: "0"

      - name: Verify committed API contracts
        run: |
          pnpm openapi
          pnpm generate:client
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.gen.d.ts

      - name: Run all repository gates
        run: pnpm verify

      - name: Build production web bundle
        run: pnpm build:web
